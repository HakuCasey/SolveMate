name: Publish website

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/website.yml
      - docs/website/**
      - scripts/build-website.mjs
      - apps/desktop/src/download-statistics.mjs
      - apps/desktop/src/installers.mjs
      - data/**
      - apps/server/src/**
      - apps/server/pyproject.toml
      - apps/server/requirements.lock
      - docs/product/manual/images/overview.jpg
      - docs/product/manual/images/conversations.jpg
      - docs/product/manual/images/notes.jpg
      - docs/product/manual/images/teaching.jpg
      - apps/web/src/assets/solvemate-wordmark.png
      - apps/web/public/icon-192.png
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/configure-pages@v5
        id: pages
      - run: node scripts/build-website.mjs
        env:
          SOLVEMATE_DOWNLOAD_STATS_URL: ${{ vars.SOLVEMATE_DOWNLOAD_STATS_URL }}
      - name: Publish community content
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python -m pip install -r apps/server/requirements.lock
          python -m pip install --no-deps --no-build-isolation ./apps/server
          solvemate-publish --data-dir data --content-dir dist/website/community --previous-url "${PAGES_URL%/}/community"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
