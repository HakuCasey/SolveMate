name: Publish website

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/website.yml
      - docs/website/**
      - scripts/build-website.mjs
      - docs/product/manual/images/overview.jpg
      - docs/product/manual/images/conversations.jpg
      - docs/product/manual/images/notes.jpg
      - docs/product/manual/images/teaching.jpg
      - apps/web/src/assets/solvemate-wordmark.png
      - apps/web/public/icon-192.png
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - run: node scripts/build-website.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/website
      - uses: actions/deploy-pages@v4
        id: deployment
