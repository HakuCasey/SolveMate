name: Publish macOS installer

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: |
          python -m pip install -r apps/server/requirements.lock -r apps/local/requirements.lock -r apps/desktop/requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e apps/local
      - name: Build and verify the Mac installer
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          npm run make --workspace @solvemate/desktop -- --arm64 --publish never
          codesign --verify --deep --strict "apps/desktop/out/mac-arm64/SolveMate.app"
          hdiutil verify "apps/desktop/out/SolveMate-${version}-arm64.dmg"
      - name: Publish the Mac installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          gh release create "$GITHUB_REF_NAME" "apps/desktop/out/SolveMate-${version}-arm64.dmg" \
            --verify-tag --latest --title "SolveMate v${version}" --generate-notes
