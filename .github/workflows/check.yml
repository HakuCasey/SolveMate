name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r apps/server/requirements.lock -r apps/local/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e apps/server -e apps/local
      - run: python -m ruff check apps/server apps/local
      - run: python -m ruff format --check apps/server apps/local
      - run: python -m pytest apps/server/tests -c apps/server/pyproject.toml
      - run: python -m pytest apps/local/tests -c apps/local/pyproject.toml
      - run: python -m pip check
