name: Publish Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: |
          python -m pip install -r apps/server/requirements.lock -r apps/local/requirements.lock -r apps/desktop/requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e apps/local
      - run: npm run desktop:make
      - name: Verify and publish the Setup.exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          exe="apps/desktop/out/SolveMate-${version}-x64-Setup.exe"
          test -f "$exe"
          gh release upload "v${version}" "$exe" --clobber
          gh release view "v${version}" --json assets --jq '.assets[].name'
