<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SolveMate</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7fb; color: #202235; }
      main { display: grid; justify-items: center; gap: 14px; }
      .logo { display: block; width: 144px; height: 144px; border-radius: 24px; }
      h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: .01em; }
      p { margin: 0; color: #72768a; font-size: 15px; }
      @media (prefers-color-scheme: dark) {
        body { background: #1b1d28; color: #f2f2f7; }
        p { color: #a8acbd; }
      }
    </style>
  </head>
  <body><main><img class="logo" src="./icon.png" alt="" /><h1>SolveMate</h1><p>正在启动…</p></main></body>
</html>
