[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solvemate-server"
version = "0.1.0"
description = "SolveMate official content catalog and downloads"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.162,<1", "pydantic>=2.14,<3", "uvicorn>=0.54,<1"]

[project.optional-dependencies]
dev = ["httpx2>=2.16,<3", "pytest>=9,<10", "ruff>=0.17,<1", "build>=1.6,<2"]

[project.scripts]
solvemate-publish = "solvemate_server.publish:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
