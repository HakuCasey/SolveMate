[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solvemate-local"
version = "0.1.0"
description = "SolveMate local AI connections and ACP sessions"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.162,<1", "pydantic>=2.14,<3", "uvicorn>=0.54,<1", "PyYAML>=6.0.3,<7", "jsonschema>=4.26,<5", "pypdf>=6.21.4,<7"]

[project.optional-dependencies]
dev = ["httpx2>=2.16,<3", "pytest>=9,<10", "ruff>=0.17,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"

[tool.setuptools.package-data]
solvemate_local = ["schemas/*.json"]
