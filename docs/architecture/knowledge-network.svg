<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">资料、对话与笔记的知识网络</title><desc id="diagram-description">资料、对话、笔记为三个核心节点，各自维护属性与内容。资料可以支撑对话，也可以直接形成笔记；对话可以整理为笔记。笔记本是笔记的归属属性。箭头表示知识传递方向，关联通过对象 ID 及版本、页码、题号或消息 ID 定位。</desc><metadata>Source: knowledge-network.drawio; generator: workspace architecture-diagrams/knowledge-network.mjs; date: 2026-11-14; conceptual domain model.</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#728197"/></marker></defs><rect width="100%" height="100%" fill="white"/><path id="material-discussion" d="M418,300 L1022,300" fill="none" stroke="#728197" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="material-note" d="M241,480 L241,710 L543,710" fill="none" stroke="#728197" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="discussion-note" d="M1199,480 L1199,710 L897,710" fill="none" stroke="#728197" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/><text id="title" x="64" y="62" dominant-baseline="central" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" fill="#253347">资料、对话与笔记的知识网络</text>
<text id="legend" x="64" y="118" dominant-baseline="central" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#677488">箭头表示知识传递方向；关联通过 ID 与定位信息建立。</text>
<rect id="material" x="64" y="180" width="354" height="300" rx="14" fill="#F7FAFF" stroke="#B5C8E0" stroke-width="1.7"/>
<text id="material-title" x="88" y="220" dominant-baseline="central" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#355F98">资料</text>
